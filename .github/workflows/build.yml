name: Build SevenSins Plugin

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: SevenSins/pom.xml

      - name: Build plugin with Maven
        run: mvn -B -f SevenSins/pom.xml clean package

      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: SevenSins-jar
          path: SevenSins/target/SevenSins-1.0.0.jar
          if-no-files-found: error
