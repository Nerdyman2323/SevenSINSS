
name: Build SevenSins Plugin

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Find Maven project
        shell: bash
        run: |
          POM_PATH="$(find . -type f -name pom.xml -not -path './.git/*' -not -path '*/target/*' -print -quit)"
          if [ -z "$POM_PATH" ]; then
            echo "::error::Could not find pom.xml. Upload your complete plugin source files, including pom.xml."
            ls -la
            exit 1
          fi
          PROJECT_DIR="$(dirname "$POM_PATH")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Found Maven project at: $POM_PATH"

      - name: Build plugin with Maven
        run: mvn -B -f "$PROJECT_DIR/pom.xml" clean package

      - name: Upload plugin JAR
        uses: actions/upload-artifact@v7
        with:
          name: SevenSins-jar
          path: ${{ env.PROJECT_DIR }}/target/SevenSins-1.0.0.jar
          if-no-files-found: error
